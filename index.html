<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hearts of Generic FantasyLandia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">

<body>
  <a class="skip" href="#main">Skip to content</a>
  <h1 class="sr-only" id="page-title">Hearts of Generic FantasyLandia</h1>
  <header id="hud" hidden>
    <div class="hud-row">
      <div id="hud-time"></div>
      <div id="hud-gold"></div>
      <div id="hud-stats"></div>
      <div class="hud-btns">
        <button class="btn icon" id="btn-people" title="Who's where" aria-label="Who's where">👥<span> People</span><b class="badge" id="ready-badge" hidden></b></button>
        <button class="btn icon" id="btn-journal" title="Journal" aria-label="Journal">📖<span> Journal</span></button>
        <button class="btn icon" id="btn-inv" title="Inventory" aria-label="Inventory">🎒<span> Items</span></button>
        <button class="btn icon" id="btn-save" title="Save / Load" aria-label="Save or load">💾<span> Save</span></button>
        <button class="btn icon music-toggle" id="btn-music" title="Music" aria-label="Music"></button>
        <button class="btn icon" id="btn-menu" title="Menu" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1"></main>
  <div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
