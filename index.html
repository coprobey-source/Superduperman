<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hearts of Generic FantasyLandia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="hud" hidden>
    <div class="hud-row">
      <div id="hud-time"></div>
      <div id="hud-gold"></div>
      <div id="hud-stats"></div>
      <div class="hud-btns">
        <button class="btn icon" id="btn-journal" title="Journal">📖<span> Journal</span></button>
        <button class="btn icon" id="btn-inv" title="Inventory">🎒<span> Items</span></button>
        <button class="btn icon" id="btn-save" title="Save / Load">💾<span> Save</span></button>
        <button class="btn icon music-toggle" id="btn-music" title="Music"></button>
        <button class="btn icon" id="btn-menu" title="Menu">☰</button>
      </div>
    </div>
  </header>
  <main id="main"></main>
  <div id="modal" hidden></div>

  <script src="js/core.js"></script>
  <script src="js/portraits.js"></script>
  <script src="js/music.js"></script>
  <script src="js/world.js"></script>
  <script src="js/chars/fenna.js"></script>
  <script src="js/chars/valeria.js"></script>
  <script src="js/chars/sylvaine.js"></script>
  <script src="js/chars/mira.js"></script>

  <script src="js/chars/shade.js"></script>
  <script src="js/chars/pell.js"></script>
  <script src="js/chars/kit.js"></script>
  <script src="js/chars/malzahra.js"></script>
  <script src="js/chars/celestine.js"></script>
  <script src="js/chars/brakka.js"></script>
  <script src="js/chars/ignivara.js"></script>
  <script src="js/chars/lilette.js"></script>
  <script src="js/chars/hilde.js"></script>
  <script src="js/chars/coralie.js"></script>
  <script src="js/chars/morwen.js"></script>
  <script src="js/chars/aurelia.js"></script>
  <script src="js/chars/bettina.js"></script>
  <script src="js/chars/gloria.js"></script>
  <script src="js/chars/hikari.js"></script>
  <script src="js/chars/brunhild.js"></script>
  <script src="js/chars/rosalind.js"></script>
  <script src="js/chars/seven.js"></script>
  <script src="js/chars/ophelia.js"></script>
  <script src="js/chars/scarlett.js"></script>
  <script src="js/chars/amorette.js"></script>
  <script src="js/crossovers.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
